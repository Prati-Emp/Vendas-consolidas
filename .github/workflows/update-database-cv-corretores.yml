name: Update Database - CV Corretores

on:
  schedule:
    # Executar diariamente as 01:15 BRT (04:15 UTC)
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razao para executar a atualizacao CV Corretores'
        required: false
        default: 'Atualizacao manual CV Corretores'
        type: string

jobs:
  update-database-cv-corretores:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (CV Corretores)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "Iniciando atualizacao CV Corretores no MotherDuck..."
          python -u scripts/update_motherduck_corretores.py

      - name: Notify success
        if: success()
        run: |
          echo "CV Corretores database updated successfully at $(date)"

      - name: Notify failure
        if: failure()
        run: |
          echo "CV Corretores database update failed at $(date)"
