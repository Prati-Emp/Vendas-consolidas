name: Update Database - CV Leads

on:
  schedule:
    # 00:30 BRT (03:30 UTC) — apos inicio da daily non-sienge (00:00 BRT)
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razao para executar a atualizacao de CV Leads'
        required: false
        default: 'Atualizacao manual CV Leads'
        type: string

jobs:
  update-database-cv-leads:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (CV Leads)
        timeout-minutes: 20
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          CV_VENDAS_BASE_URL: ${{ secrets.CV_VENDAS_BASE_URL }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "Iniciando atualizacao dedicada de CV Leads no MotherDuck..."
          python -u scripts/update_motherduck_cv_leads_daily.py

      - name: Notify success
        if: success()
        run: echo "CV Leads database updated successfully at $(date)"

      - name: Notify failure
        if: failure()
        run: echo "CV Leads database update failed at $(date)"
