name: Update Database - Contas Pagas (Diário Madrugada)

on:
  schedule:
    # Executar diariamente às 02:00 BRT (05:00 UTC) - madrugada
    - cron: '0 5 * * *'  # Todo dia às 05:00 UTC (02:00 BRT)
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razão para executar a atualização de Contas Pagas'
        required: false
        default: 'Atualização manual Contas Pagas'
        type: string
      initial_mode:
        description: 'Modo inicial (buscar desde 2025-01-01)'
        required: false
        default: 'false'
        type: boolean

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (Contas Pagas API only)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          SIENGE_TOKEN: ${{ secrets.SIENGE_TOKEN }}
          SIENGE_CONTAS_PAGAS_MODO_INICIAL: ${{ inputs.initial_mode || 'false' }} # Controla o modo inicial
          SIENGE_CONTAS_PAGAS_DIAS_RETRO: '30' # Dias de retrocesso para busca diária
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "Iniciando atualizacao diaria de Contas Pagas do MotherDuck..."
          python -u scripts/update_motherduck_contas_pagas.py
      
      - name: Notify success
        if: success()
        run: |
          echo "OK: Contas Pagas database updated successfully at $(date)"
      
      - name: Notify failure
        if: failure()
        run: |
          echo "ERRO: Contas Pagas database update failed at $(date)"

