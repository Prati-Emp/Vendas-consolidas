name: Update Database - Sienge Diário Geral

on:
  schedule:
    # 01:20 BRT (04:20 UTC) — antecipado p/ concluir até 07:00 BRT (atraso típico GitHub ~4h)
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razão para executar a atualização diária geral do Sienge'
        required: false
        default: 'Execução manual Sienge diária'
        type: string

jobs:
  update-database-sienge-diario-geral:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (Sienge Contratos + Pedidos)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          SIENGE_TOKEN: ${{ secrets.SIENGE_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "🌐 Iniciando atualização Sienge diária geral..."
          python -u scripts/update_motherduck_sienge_diario_geral.py

      - name: Notify success
        if: success()
        run: echo "✅ Sienge diário geral atualizado com sucesso em $(date)"

      - name: Notify failure
        if: failure()
        run: echo "❌ Sienge diário geral falhou em $(date)"

