name: Update Database - VGV

on:
  schedule:
    # Executar diariamente às 06:00 BRT (09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razao para executar a atualizacao de VGV'
        required: false
        default: 'Atualizacao manual VGV'
        type: string

jobs:
  update-database-vgv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (VGV)
        timeout-minutes: 20
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          CV_VENDAS_BASE_URL: ${{ secrets.CV_VENDAS_BASE_URL }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "Iniciando atualizacao dedicada de VGV no MotherDuck..."
          python -u scripts/update_motherduck_vgv_daily.py

      - name: Notify success
        if: success()
        run: echo "Daily VGV database updated successfully at $(date)"

      - name: Notify failure
        if: failure()
        run: echo "Daily VGV database update failed at $(date)"
