name: Update Database - Jira QLD

on:
  schedule:
    # 00:20 BRT (03:20 UTC) — após DHO (03:00) e Jurídico (03:10)
    - cron: '20 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razão para executar a atualização Jira QLD (NC - Não Conformidade)'
        required: false
        default: 'Atualização manual Jira QLD'
        type: string

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (Jira QLD API only)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "Iniciando atualizacao Jira QLD do MotherDuck..."
          python -u scripts/update_motherduck_jira_qld.py

      - name: Notify success
        if: success()
        run: |
          echo "OK: Jira QLD database updated successfully at $(date)"

      - name: Notify failure
        if: failure()
        run: |
          echo "ERRO: Jira QLD database update failed at $(date)"
