name: Snapshot Mensal - Pró-Soluto

on:
  schedule:
    # Roda no dia 1º de cada mês às 03:30 BRT (06:30 UTC)
    # 30 minutos após o de inadimplência para evitar conflito de conexão
    - cron: '30 6 1 * *'
  workflow_dispatch:
    inputs:
      meses:
        description: 'Meses para processar (ex: 2025-10 2025-11 2025-12). Vazio = mês anterior.'
        required: false
        default: ''
        type: string

jobs:
  snapshot-prosoluto:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1 python-dateutil
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Run snapshot pró-soluto
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "Iniciando snapshot mensal de pró-soluto..."
          if [ -n "${{ github.event.inputs.meses }}" ]; then
            python -u scripts/snapshot_prosoluto.py ${{ github.event.inputs.meses }}
          else
            python -u scripts/snapshot_prosoluto.py
          fi

      - name: Notify success
        if: success()
        run: echo "OK: Snapshot de pró-soluto concluído com sucesso em $(date)"

      - name: Notify failure
        if: failure()
        run: echo "ERRO: Snapshot de pró-soluto falhou em $(date)"
