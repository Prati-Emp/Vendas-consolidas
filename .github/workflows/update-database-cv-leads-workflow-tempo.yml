name: Update Database - CV Leads Workflow Tempo

on:
  schedule:
    # 02:00 BRT (05:00 UTC) — apos CV Leads dedicado para reduzir disputa de lock
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razao para executar a atualizacao de Leads Workflow Tempo'
        required: false
        default: 'Atualizacao manual Leads Workflow Tempo'
        type: string

jobs:
  update-database-cv-leads-workflow-tempo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (CV Leads Workflow Tempo)
        timeout-minutes: 30
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          CV_VENDAS_BASE_URL: ${{ secrets.CV_VENDAS_BASE_URL }}
          # Opcional: sobrescrever data de corte (YYYY-MM-DD). Padrao no script: 2022-01-01
          # CV_LEADS_WORKFLOW_DATA_INICIO: '2022-01-01'
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "Iniciando atualizacao dedicada de CV Leads Workflow Tempo no MotherDuck..."
          python -u scripts/update_motherduck_cv_leads_workflow_tempo_daily.py

      - name: Notify success
        if: success()
        run: echo "CV Leads Workflow Tempo database updated successfully at $(date)"

      - name: Notify failure
        if: failure()
        run: echo "CV Leads Workflow Tempo database update failed at $(date)"
