name: Update Database - CV Times Imobiliarias

on:
  schedule:
    # 00:00 BRT (03:00 UTC) — antecipado p/ concluir até 07:00 BRT (atraso típico GitHub ~4h)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razao para executar a atualizacao CV Times Imobiliarias'
        required: false
        default: 'Atualizacao manual CV Times Imobiliarias'
        type: string

jobs:
  update-database-cv-times-imobiliarias:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (CV Times Imobiliarias)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "Iniciando atualizacao CV Times Imobiliarias no MotherDuck..."
          python -u scripts/update_motherduck_times_imobiliarias.py

      - name: Notify success
        if: success()
        run: |
          echo "CV Times Imobiliarias database updated successfully at $(date)"

      - name: Notify failure
        if: failure()
        run: |
          echo "CV Times Imobiliarias database update failed at $(date)"
