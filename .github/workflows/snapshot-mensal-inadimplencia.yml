name: Snapshot Mensal - Inadimplencia

on:
  schedule:
    # Roda no dia 1 de cada mes as 03:00 BRT (06:00 UTC)
    # Captura o fechamento do mes anterior
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      meses:
        description: 'Meses para processar (ex: 2025-10 2025-11 2025-12). Vazio = mes anterior.'
        required: false
        default: ''
        type: string

jobs:
  snapshot-inadimplencia:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Run snapshot inadimplencia
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "Iniciando snapshot mensal de inadimplencia..."
          if [ -n "${{ github.event.inputs.meses }}" ]; then
            python -u scripts/snapshot_inadimplencia.py ${{ github.event.inputs.meses }}
          else
            python -u scripts/snapshot_inadimplencia.py
          fi

      - name: Notify success
        if: success()
        run: |
          echo "Snapshot de inadimplencia concluido com sucesso em $(date)"
      
      - name: Notify failure
        if: failure()
        run: |
          echo "Snapshot de inadimplencia falhou em $(date)"
