name: Snapshot Mensal - Inadimplencia

on:
  schedule:
    # Roda todo dia 10 do mes as 06:00 UTC (03:00 BRT)
    - cron: '0 6 10 * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razao para executar manualmente'
        required: false
        default: 'Execucao manual snapshot inadimplencia'
        type: string

jobs:
  snapshot-inadimplencia:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Run snapshot inadimplencia
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "Iniciando snapshot mensal de inadimplencia..."
          python -u scripts/snapshot_inadimplencia.py

      - name: Notify success
        if: success()
        run: |
          echo "Snapshot de inadimplencia concluido com sucesso em $(date)"

      - name: Notify failure
        if: failure()
        run: |
          echo "Snapshot de inadimplencia falhou em $(date)"
