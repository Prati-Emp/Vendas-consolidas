name: Update Database - CV Assistencias Workflow Tempo

on:
  schedule:
    # 01:20 BRT (04:20 UTC) — antecipado p/ concluir até 07:00 BRT (atraso típico GitHub ~4h)
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razao para executar a atualizacao CV Assistencias Workflow Tempo'
        required: false
        default: 'Atualizacao manual CV Assistencias Workflow Tempo'
        type: string

jobs:
  update-database-cv-assistencias-workflow-tempo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (CV Assistencias Workflow Tempo)
        timeout-minutes: 30
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "Iniciando atualizacao CV Assistencias Workflow Tempo no MotherDuck..."
          python -u scripts/update_motherduck_assistencias_workflow_tempo.py

      - name: Notify success
        if: success()
        run: |
          echo "CV Assistencias Workflow Tempo database updated successfully at $(date)"

      - name: Notify failure
        if: failure()
        run: |
          echo "CV Assistencias Workflow Tempo database update failed at $(date)"
