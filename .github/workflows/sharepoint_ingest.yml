name: Update MotherDuck - Planilhas SharePoint

on:
  schedule:
    # Executa às 12:30 e 20:00 BRT (15:30 e 23:00 UTC)
    - cron: '30 15 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch: # Permite execução manual

jobs:
  update-sharepoint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run SharePoint Ingestion
      env:
        # Variáveis de Ambiente para Microsoft Graph
        SHAREPOINT_TENANT_ID: 'f6e5f47f-eb3e-4de3-a4e3-648d931a2eb9'
        SHAREPOINT_CLIENT_ID: '87298303-83fe-464f-a246-a968a3d2d651'
        SHAREPOINT_SITE_HOSTNAME: 'pratiemp318.sharepoint.com'
        SHAREPOINT_SITE_PATH: '/sites/Materialatualizaodiria'
        SHAREPOINT_FOLDER_PATH: 'arquivosatualizacao'
        
        # Secrets (Cadastrar no GitHub)
        SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
        MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      run: |
        python scripts/sharepoint_api_ingest.py


