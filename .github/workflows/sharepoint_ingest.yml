name: Update MotherDuck - Planilhas SharePoint

on:
  schedule:
    # Executa às 06:00 e 18:00 BRT (09:00 e 21:00 UTC)
    # Ajuste o UTC conforme horário de verão se necessário
    - cron: '0 9,21 * * *'
  workflow_dispatch: # Permite execução manual

jobs:
  update-sharepoint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl duckdb Office365-REST-Python-Client python-dotenv
        
    - name: Run SharePoint Ingestion
      env:
        # Variáveis de Ambiente
        SHAREPOINT_SITE_URL: 'https://pratiemp318.sharepoint.com/sites/Materialatualizaodiria'
        SHAREPOINT_CLIENT_ID: '87298303-83fe-464f-a246-a968a3d2d651'
        # Caminho da pasta (ajustável se descobrirmos que é outro nome)
        SHAREPOINT_FOLDER_REL_URL: '/sites/Materialatualizaodiria/Shared Documents/arquivosatualizacao'
        
        # Secrets (Cadastrar no GitHub)
        SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
        MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      run: |
        python scripts/sharepoint_api_ingest.py


