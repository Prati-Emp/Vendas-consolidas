name: Update Database - Medições (Mensal)

on:
  schedule:
    # Executar mensalmente no dia 7 às 02:00 BRT (05:00 UTC)
    - cron: '0 5 7 * *'  # Todo dia 7 do mês às 05:00 UTC (02:00 BRT)
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razão para executar a atualização de Medições'
        required: false
        default: 'Atualização manual Medições'
        type: string

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (Medições API only)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          SIENGE_TOKEN: ${{ secrets.SIENGE_TOKEN }}
          SIENGE_MEDICOES_MODO_INICIAL: ${{ secrets.SIENGE_MEDICOES_MODO_INICIAL || 'false' }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "Iniciando atualizacao mensal de Medicoes do MotherDuck..."
          echo "Modo inicial: $SIENGE_MEDICOES_MODO_INICIAL"
          python -u scripts/update_motherduck_medicoes.py
      
      - name: Notify success
        if: success()
        run: |
          echo "OK: Medicoes database updated successfully at $(date)"
      
      - name: Notify failure
        if: failure()
        run: |
          echo "ERRO: Medicoes database update failed at $(date)"

