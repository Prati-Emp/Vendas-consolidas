name: Update Database - Sienge (Daily)

on:
  schedule:
    # Executar diariamente às 02:00 BRT (05:00 UTC)
    - cron: '0 5 * * *'  # Diariamente às 05:00 UTC (02:00 BRT)
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razão para executar a atualização Sienge'
        required: false
        default: 'Atualização manual Sienge'
        type: string

jobs:
  update-database-sienge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (Sienge APIs only)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          SIENGE_BASE_URL: ${{ secrets.SIENGE_BASE_URL }}
          SIENGE_TOKEN: ${{ secrets.SIENGE_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
          # Flags para execução apenas Sienge
          SIENGE_ONLY_MODE: 'true'
          SIENGE_SKIP_CANCELADAS: 'false'  # Incluir canceladas no Sienge
        run: |
          echo "🌙 Iniciando atualização Sienge do MotherDuck (diário)..."
          python -u scripts/update_motherduck_sienge.py
      
      - name: Notify success
        if: success()
        run: echo "✅ Sienge database updated successfully at $(date)"
      
      - name: Notify failure
        if: failure()
        run: echo "❌ Sienge database update failed at $(date)"



