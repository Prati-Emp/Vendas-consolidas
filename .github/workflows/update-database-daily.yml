name: Update Database - Daily (Non-Sienge)

on:
  schedule:
    # Executar diariamente às 01:00 BRT (04:00 UTC) 
    - cron: '0 4 * * *'  # Diariamente às 04:00 UTC (01:00 BRT)
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razão para executar a atualização diária'
        required: false
        default: 'Atualização manual diária'
        type: string

jobs:
  update-database-daily:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (Daily APIs)
        timeout-minutes: 20
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          CV_VENDAS_BASE_URL: ${{ secrets.CV_VENDAS_BASE_URL }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
          # Flags para execução diária (sem Sienge)
          DAILY_UPDATE_MODE: 'true'
          SKIP_SIENGE_APIS: 'true'
          CV_REPASSES_ENABLED: 'true'
          CV_LEADS_ENABLED: 'true'
          CV_REPASSES_WORKFLOW_ENABLED: 'true'
        run: |
          echo "🌅 Iniciando atualização diária do MotherDuck (APIs não-Sienge)..."
          python -u scripts/update_motherduck_daily.py
      
      - name: Notify success
        if: success()
        run: echo "✅ Daily database updated successfully at $(date)"
      
      - name: Notify failure
        if: failure()
        run: echo "❌ Daily database update failed at $(date)"



