name: Update Database - CV Comissões (Diário)

on:
  schedule:
    # Executar diariamente às 03:45 BRT (06:45 UTC)
    - cron: '45 6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razão para executar a atualização CV Comissões'
        required: false
        default: 'Atualização manual CV Comissões'
        type: string

jobs:
  update-database-comissoes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (CV Comissões)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "🌙 Iniciando atualização CV Comissões do MotherDuck..."
          python -u scripts/update_motherduck_comissoes.py
      
      - name: Notify success
        if: success()
        run: echo "✅ CV Comissões database updated successfully at $(date)"
      
      - name: Notify failure
        if: failure()
        run: echo "❌ CV Comissões database update failed at $(date)"
