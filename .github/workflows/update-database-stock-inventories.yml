name: Update Database - Stock Inventories (Mensal - dia 5)

on:
  schedule:
    # Executar mensalmente no dia 5 às 02:00 BRT (05:00 UTC)
    - cron: '0 5 5 * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razão para executar a atualização de Stock Inventories'
        required: false
        default: 'Atualização manual Stock Inventories'
        type: string

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (Stock Inventories API only)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          SIENGE_TOKEN: ${{ secrets.SIENGE_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "Iniciando atualizacao mensal de Stock Inventories no MotherDuck..."
          python -u scripts/update_motherduck_stock_inventories.py

      - name: Notify success
        if: success()
        run: |
          echo "OK: Stock Inventories database updated successfully at $(date)"

      - name: Notify failure
        if: failure()
        run: |
          echo "ERRO: Stock Inventories database update failed at $(date)"
