name: Update Database - CV Repasses Todas Condicoes

on:
  schedule:
    # 00:45 BRT (03:45 UTC) — depois do job diario de cv_repasses (03:00 UTC)
    - cron: '45 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razao para executar a atualizacao de repasses (todas as condicoes)'
        required: false
        default: 'Atualizacao manual cv_repasses_todas_condicoes'
        type: string

jobs:
  update-database-cv-repasses-todas-condicoes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          pip install -r requirements.txt

      - name: Set file permissions
        run: chmod +x scripts/*.py

      - name: Update database (Repasses Todas Condicoes)
        timeout-minutes: 20
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          echo "Iniciando atualizacao de main.cv_repasses_todas_condicoes..."
          python -u scripts/update_motherduck_cv_repasses_todas_condicoes.py

      - name: Notify success
        if: success()
        run: echo "cv_repasses_todas_condicoes updated successfully at $(date)"

      - name: Notify failure
        if: failure()
        run: echo "cv_repasses_todas_condicoes update failed at $(date)"
